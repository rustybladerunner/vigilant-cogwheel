[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ministral-finetuner"
version = "0.1.0"
description = "A framework for fine-tuning Ministral-3B models locally"
authors = [{name = "rustybladerunner", email = "176958705+rustybladerunner@users.noreply.github.com"}]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "datasets==3.6.0",
    "pyyaml==6.0.3",
    "rich==14.3.4",
]

[project.scripts]
ministral-train = "cli.main:main"

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
# Versioned API target, not a GPU-validated environment lock.
train = ["unsloth==2026.9.11", "trl==0.24.0", "transformers==4.56.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
